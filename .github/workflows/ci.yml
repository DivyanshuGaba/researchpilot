name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The tests expect Postgres on 5433 (the docker compose mapping) and Redis on 6379.
  DATABASE_URL: postgresql+psycopg://rp_app:rp_app@localhost:5433/researchpilot
  MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5433/researchpilot
  REDIS_URL: redis://localhost:6379/0

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: researchpilot
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d researchpilot" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install (CPU-only torch, then the project)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app eval
      - name: Migrate (also proves a fresh database upgrades to head)
        run: alembic upgrade head
      - name: Tests (no network, the model client is mocked)
        run: pytest -q

  eval-smoke:
    name: Evaluation smoke (recorded replies, no API calls)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: researchpilot
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d researchpilot" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Cache embedding and reranker models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-minilm-v1
      - run: alembic upgrade head
      - name: Download the pinned papers and verify every answer's evidence
        run: |
          python -m eval.fetch_docs
          python -I eval/verify_dataset.py
      - name: Smoke evaluation (fails if quality drops below eval/baseline.json)
        run: python -m eval.run_eval --smoke --label ci-smoke
        env:
          # Replay only. No ANTHROPIC_API_KEY is provided, so a miss cannot spend money.
          CACHE_ENABLED: "false"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-smoke-results
          path: backend/eval/results/ci-smoke.*

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
